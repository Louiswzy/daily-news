<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily News</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e10;--surface:#16161a;--surface2:#1e1e24;--border:#2a2a32;--accent:#e8c97a;--danger:#e87a7a;--success:#7ae8a8;--text:#e8e6df;--text2:#8a8880;--text3:#4a4845;--r:10px;--rs:6px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.6;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;opacity:0.25;pointer-events:none;z-index:0;}
.app{position:relative;z-index:1;display:flex;min-height:100vh;}

/* SIDEBAR */
.sidebar{width:240px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.main{flex:1;padding:40px 48px 80px;min-width:0;}
@media(max-width:768px){.sidebar{display:none;}.main{padding:24px 16px 60px;}}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:6px 8px;margin-bottom:14px;}
.sidebar-logo-mark{width:30px;height:30px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;}
.sidebar-logo-name{font-family:'Noto Serif SC',serif;font-size:14px;font-weight:600;}
.sidebar-section{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase;padding:4px 8px;margin-top:10px;}
.sidebar-nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--rs);cursor:pointer;font-size:12px;color:var(--text2);transition:background 0.1s;}
.sidebar-nav-item:hover{background:var(--surface2);color:var(--text);}
.sidebar-nav-item.active{color:var(--accent);background:var(--surface2);}
.month-toggle{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:var(--rs);cursor:pointer;font-size:12px;font-weight:500;color:var(--text2);transition:background 0.1s;user-select:none;}
.month-toggle:hover{background:var(--surface2);}
.month-toggle .arr{font-size:9px;transition:transform 0.2s;}
.month-toggle.open .arr{transform:rotate(90deg);}
.month-days{display:none;padding-left:18px;}
.month-days.open{display:block;}
.day-link{display:block;padding:4px 8px;border-radius:var(--rs);cursor:pointer;font-size:11px;color:var(--text3);transition:background 0.1s,color 0.1s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.day-link:hover{background:var(--surface2);color:var(--text2);}
.day-link.active{color:var(--accent);}

/* HEADER */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
.page-title{font-family:'Noto Serif SC',serif;font-size:24px;font-weight:600;}
.page-sub{font-size:11px;color:var(--text2);margin-top:4px;letter-spacing:0.06em;}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--rs);font-size:13px;font-weight:500;cursor:pointer;transition:opacity 0.15s,transform 0.1s;border:none;white-space:nowrap;}
.btn:active{transform:scale(0.97);}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.btn-primary{background:var(--accent);color:#0e0e10;}
.btn-primary:hover{opacity:0.88;}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--text2);}
.btn-sm{padding:6px 12px;font-size:12px;}
.spinner{width:13px;height:13px;border:2px solid rgba(0,0,0,0.15);border-top-color:#0e0e10;border-radius:50%;animation:spin 0.7s linear infinite;}
.spinner-light{border-color:var(--border);border-top-color:var(--text2);}
@keyframes spin{to{transform:rotate(360deg);}}
.status-bar{display:none;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--border);border-radius:var(--rs);font-size:13px;color:var(--text2);margin-bottom:20px;}

/* SEARCH */
.search-wrap{display:flex;align-items:center;gap:6px;}
.search-input{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:6px 12px;color:var(--text);font-size:13px;outline:none;width:170px;transition:border-color 0.15s,width 0.2s;}
.search-input:focus{border-color:var(--accent);width:210px;}
.search-input::placeholder{color:var(--text3);}

/* TRANSLATE */
.translate-wrap{position:relative;}
.translate-btn{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:var(--rs);font-size:12px;font-weight:500;cursor:pointer;background:var(--surface);color:var(--text);border:1px solid var(--border);}
.translate-btn:hover{border-color:var(--text2);}
.translate-dropdown{display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;z-index:50;min-width:130px;box-shadow:0 8px 24px rgba(0,0,0,0.4);}
.translate-dropdown.open{display:block;}
.translate-option{padding:10px 16px;font-size:13px;cursor:pointer;color:var(--text2);}
.translate-option:hover{background:var(--surface2);color:var(--text);}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:28px;width:100%;max-width:480px;margin:16px;}
.modal-title{font-size:16px;font-weight:600;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;}
.modal-close{cursor:pointer;color:var(--text2);font-size:18px;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.field-label{font-size:11px;color:var(--text2);letter-spacing:0.06em;font-weight:500;}
.field-input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:9px 12px;color:var(--text);font-size:13px;font-family:'DM Mono',monospace;outline:none;width:100%;}
.field-input:focus{border-color:var(--accent);}
.field-input::placeholder{color:var(--text3);}
.field-hint{font-size:11px;color:var(--text3);line-height:1.5;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

/* EMPTY */
.empty{text-align:center;padding:80px 20px;}
.empty-icon{font-size:44px;margin-bottom:16px;opacity:0.3;}
.empty-text{font-size:15px;color:var(--text2);margin-bottom:8px;}
.empty-sub{font-size:13px;color:var(--text3);}

/* ARCHIVE */
.archive-month{margin-bottom:8px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.archive-month-header{display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;background:var(--surface);transition:background 0.1s;user-select:none;}
.archive-month-header:hover{background:var(--surface2);}
.archive-month-header .arr{font-size:11px;transition:transform 0.2s;color:var(--text2);}
.archive-month-header.open .arr{transform:rotate(90deg);}
.archive-month-title{font-size:14px;font-weight:600;}
.archive-month-count{font-size:12px;color:var(--text3);margin-left:auto;}
.archive-month-body{display:none;border-top:1px solid var(--border);}
.archive-month-body.open{display:block;}
.archive-day-item{display:flex;align-items:center;gap:12px;padding:12px 18px;cursor:pointer;transition:background 0.1s;border-bottom:1px solid var(--border);}
.archive-day-item:last-child{border-bottom:none;}
.archive-day-item:hover{background:var(--surface2);}
.archive-day-date{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);flex-shrink:0;width:76px;}
.archive-day-title{font-size:13px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* DETAIL */
.detail-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);cursor:pointer;margin-bottom:16px;padding:5px 10px;border-radius:var(--rs);}
.detail-back:hover{background:var(--surface);}
.detail-title{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:600;margin-bottom:5px;}
.detail-meta{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);margin-bottom:24px;}
.region-block{margin-bottom:26px;}
.region-header{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.region-header::after{content:'';flex:1;height:1px;background:var(--border);}

/* NEWS CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 17px;margin-bottom:9px;transition:border-color 0.15s;}
.card:hover{border-color:var(--text3);}
.card.bookmarked{border-color:rgba(232,201,122,0.4);}
.card-top{display:flex;align-items:flex-start;gap:9px;}
.badge{font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;white-space:nowrap;flex-shrink:0;margin-top:3px;}
.b-ai{background:rgba(122,159,232,0.15);color:#7a9fe8;}
.b-ec{background:rgba(122,232,168,0.15);color:#7ae8a8;}
.b-dm{background:rgba(232,201,122,0.15);color:#e8c97a;}
.card-title{font-size:14px;font-weight:500;color:var(--text);line-height:1.5;flex:1;}
.card-actions{display:flex;align-items:center;gap:4px;flex-shrink:0;margin-top:-1px;}
.card-icon-btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:5px;transition:background 0.15s;}
.card-icon-btn:hover{background:var(--surface2);}
.bookmark-btn svg{fill:none;stroke:var(--text3);transition:stroke 0.2s,fill 0.2s;}
.bookmark-btn.active svg{fill:var(--accent);stroke:var(--accent);}
.expand-btn svg{stroke:var(--text3);transition:transform 0.25s,stroke 0.15s;}
.expand-btn:hover svg{stroke:var(--text2);}
.expand-btn.open svg{transform:rotate(180deg);}
.card-detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.card-detail.open{display:block;}
.card-body{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:10px;}
.card-url{display:inline-flex;align-items:center;gap:4px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);text-decoration:none;word-break:break-all;}
.card-url:hover{color:var(--text2);}
.editorial{background:var(--surface);border-left:3px solid var(--accent);border-radius:var(--r);padding:16px 18px;margin-top:22px;}
.editorial-label{font-size:11px;font-weight:500;color:var(--accent);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;}
.editorial-text{font-size:13px;color:var(--text);line-height:1.8;}

/* HIGHLIGHTS */
.section-divider{display:flex;align-items:center;gap:12px;margin:48px 0 24px;}
.section-divider-line{flex:1;height:1px;background:var(--border);}
.section-divider-title{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:0.1em;text-transform:uppercase;white-space:nowrap;}
.highlights-month{margin-bottom:12px;border:1px solid rgba(232,201,122,0.2);border-radius:var(--r);overflow:hidden;}
.highlights-month-header{display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;background:rgba(232,201,122,0.04);transition:background 0.1s;user-select:none;}
.highlights-month-header:hover{background:rgba(232,201,122,0.08);}
.highlights-month-header .arr{font-size:11px;transition:transform 0.2s;color:var(--accent);}
.highlights-month-header.open .arr{transform:rotate(90deg);}
.highlights-month-title{font-size:14px;font-weight:600;color:var(--accent);}
.highlights-month-count{font-size:12px;color:var(--text3);margin-left:auto;}
.highlights-month-body{display:none;border-top:1px solid rgba(232,201,122,0.15);}
.highlights-month-body.open{display:block;}
.highlights-month-actions{padding:14px 18px 0;}
.highlights-grid{padding:14px 18px;}
.highlight-card{background:var(--surface2);border:1px solid rgba(232,201,122,0.2);border-radius:var(--rs);padding:13px 15px;margin-bottom:8px;}
.highlight-card-top{display:flex;align-items:flex-start;gap:8px;}
.highlight-card-title{font-size:13px;font-weight:500;color:var(--text);flex:1;line-height:1.5;}
.highlight-remove{cursor:pointer;color:var(--text3);font-size:14px;padding:2px 4px;border-radius:3px;flex-shrink:0;}
.highlight-remove:hover{color:var(--danger);}
.highlight-badge{font-size:9px;font-weight:500;padding:2px 6px;border-radius:3px;white-space:nowrap;flex-shrink:0;margin-top:2px;}

/* SUMMARY PAGE */
.summary-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;}
.summary-item-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);}
.summary-item-num{width:26px;height:26px;background:var(--accent);color:#0e0e10;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.summary-item-title{font-size:15px;font-weight:600;color:var(--text);line-height:1.4;}
.summary-para{font-size:13px;color:var(--text2);line-height:1.8;margin-bottom:12px;padding:12px 14px;background:var(--surface2);border-radius:var(--rs);}
.summary-note-label{font-size:11px;font-weight:500;color:var(--accent);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;margin-top:16px;}
.summary-note-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;resize:vertical;min-height:80px;line-height:1.6;}
.summary-note-input:focus{border-color:var(--accent);}
.summary-note-input::placeholder{color:var(--text3);}
.summary-note-save{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--rs);font-size:12px;font-weight:500;cursor:pointer;background:var(--surface);color:var(--text2);border:1px solid var(--border);margin-top:8px;}
.summary-note-save:hover{border-color:var(--accent);color:var(--accent);}
.summary-note-saved{color:var(--success);font-size:12px;margin-top:6px;display:none;}

/* URL SUMMARIZER */
.url-summarizer{display:flex;height:calc(100vh - 120px);gap:0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.url-toc{width:260px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;transition:width 0.25s;position:relative;}
.url-toc.collapsed{width:0;border:none;overflow:visible;}
.url-toc.collapsed .url-toc-header,.url-toc.collapsed .url-toc-content{display:none;}
.url-toc-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text2);letter-spacing:0.06em;text-transform:uppercase;position:sticky;top:0;background:var(--surface);z-index:1;}
.toc-expand-btn{display:none;position:absolute;top:14px;left:8px;width:28px;height:28px;background:var(--surface);border:1px solid var(--border);border-radius:6px;cursor:pointer;align-items:center;justify-content:center;color:var(--text2);font-size:14px;z-index:10;transition:background 0.1s;}
.toc-expand-btn:hover{background:var(--surface2);color:var(--text);}
.url-toc.collapsed .toc-expand-btn{display:flex;}
.toc-toggle-btn{cursor:pointer;color:var(--text3);padding:3px;border-radius:3px;transition:color 0.1s;}
.toc-toggle-btn:hover{color:var(--text2);}
.url-toc-content{padding:12px 8px;}
.toc-group{}
.toc-group-title{font-size:12px;font-weight:600;color:var(--text);padding:6px 8px;cursor:pointer;border-radius:var(--rs);display:flex;align-items:center;gap:6px;user-select:none;}
.toc-group-title:hover{background:var(--surface2);}
.toc-group-title .arr{font-size:8px;transition:transform 0.2s;color:var(--text3);}
.toc-group-title.open .arr{transform:rotate(90deg);}
.toc-items{display:none;padding-left:16px;}
.toc-items.open{display:block;}
.toc-item{font-size:11px;color:var(--text3);padding:4px 8px;border-radius:var(--rs);cursor:pointer;display:block;transition:color 0.1s,background 0.1s;}
.toc-item:hover{color:var(--text2);background:var(--surface2);}
.toc-item.active{color:var(--accent);}
.url-content{flex:1;overflow-y:auto;padding:28px 32px;}
.url-input-area{padding:28px 32px;overflow-y:auto;width:100%;}
.url-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.url-field{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:9px 12px;color:var(--text);font-size:13px;font-family:'DM Mono',monospace;outline:none;}
.url-field:focus{border-color:var(--accent);}
.url-field::placeholder{color:var(--text3);}
.url-remove-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);border-radius:4px;flex-shrink:0;}
.url-remove-btn:hover{color:var(--danger);background:rgba(232,122,122,0.1);}
.url-add-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border:1px dashed var(--border);border-radius:var(--rs);color:var(--text3);cursor:pointer;font-size:13px;transition:color 0.1s,border-color 0.1s;background:none;}
.url-add-btn:hover{color:var(--text2);border-color:var(--text2);}
.summ-section{margin-bottom:32px;scroll-margin-top:20px;}
.summ-section-title{font-family:'Noto Serif SC',serif;font-size:17px;font-weight:600;color:var(--text);margin-bottom:6px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.summ-subsection{margin-bottom:20px;}
.summ-subsection-title{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:10px;}
.summ-para{font-size:13px;color:var(--text2);line-height:1.8;margin-bottom:10px;padding:12px 14px;background:var(--surface2);border-radius:var(--rs);}
.summ-sources{margin-top:10px;padding:10px 14px;background:rgba(232,201,122,0.05);border:1px solid rgba(232,201,122,0.15);border-radius:var(--rs);}
.summ-source-label{font-size:10px;font-weight:600;color:var(--accent);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;}
.summ-source-url{display:block;font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);text-decoration:none;word-break:break-all;margin-bottom:3px;}
.summ-source-url:hover{color:var(--text2);}

/* SUMM ARCHIVE */
.summ-archive-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:border-color 0.15s;}
.summ-archive-card:hover{border-color:var(--text3);}
.summ-archive-card-title{font-size:14px;font-weight:500;color:var(--text);margin-bottom:4px;}
.summ-archive-card-meta{font-size:11px;color:var(--text3);}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-mark">📡</div>
      <div class="sidebar-logo-name">Daily News</div>
    </div>
    <div class="sidebar-section">信息提供</div>
    <div class="sidebar-nav-item" id="nav-archive" onclick="showArchive()">📅 每日新闻</div>
    <div id="sidebarArchive" style="margin-top:4px;"></div>
    <div class="sidebar-nav-item" id="nav-highlights" onclick="showHighlightsPage()" style="margin-top:6px;">⭐ 重点新闻</div>
    <div class="sidebar-section">信息整理</div>
    <div class="sidebar-nav-item" id="nav-summarizer" onclick="showSummarizer()">📝 新闻总结</div>
    <div class="sidebar-nav-item" id="nav-summ-archive" onclick="showSummArchive()">🗂️ 总结收藏</div>
  </div>
  <div class="main">
    <div class="page-header">
      <div>
        <div class="page-title">Daily News</div>
        <div class="page-sub">AI · E-commerce · Digital Marketing</div>
      </div>
      <div class="header-actions">
        <div class="translate-wrap" id="translateWrap">
          <div class="translate-btn" id="translateBtn" onclick="toggleTranslateMenu()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
            <span id="translateLabel">语言</span>
            <span style="font-size:9px;color:var(--text3);">▾</span>
          </div>
          <div class="translate-dropdown" id="translateDropdown">
            <div class="translate-option" onclick="doTranslate('zh-CN','简体中文')">🇨🇳 简体中文</div>
            <div class="translate-option" onclick="doTranslate('en','English')">🇺🇸 English</div>
            <div class="translate-option" onclick="doTranslate('ja','日本語')">🇯🇵 日本語</div>
          </div>
        </div>

// ── Date ──
function getToday() {
  var d = new Date();
  return d.getFullYear() + '年' + String(d.getMonth()+1).padStart(2,'0') + '月' + String(d.getDate()).padStart(2,'0') + '日';
}
function getTodayStr() {
  var d = new Date();
  return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
}
function getMonthKey() {
  var d = new Date();
  return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0');
}
function fmtMonth(mk) { return mk.slice(0,4) + '年' + mk.slice(4,6) + '月'; }
function fmtDate(dk)  { return dk.slice(0,4) + '年' + dk.slice(4,6) + '月' + dk.slice(6,8) + '日'; }
function nowTs() { return new Date().toLocaleString('zh-CN'); }

// ── Storage ──
function loadArchive() { try { return JSON.parse(localStorage.getItem(SK_NEWS) || '{}'); } catch(e) { return {}; } }
function saveArchive(a) { localStorage.setItem(SK_NEWS, JSON.stringify(a)); }

function mergeIntoArchive(dk, mk, newData) {
  var a = loadArchive();
  if (!a[mk]) a[mk] = {};
  if (!a[mk][dk]) {
    a[mk][dk] = newData;
  } else {
    var existing = a[mk][dk];
    var merged = JSON.parse(JSON.stringify(existing));
    if (!merged.regions) merged.regions = {};
    ['eu_us','china','sea','japan'].forEach(function(rk) {
      var newItems = (newData.regions && newData.regions[rk]) || [];
      if (!merged.regions[rk]) merged.regions[rk] = [];
      var usedUrls   = merged.regions[rk].map(function(x){ return x.url; }).filter(Boolean);
      var usedTitles = merged.regions[rk].map(function(x){ return x.title; });
      newItems.forEach(function(item) {
        var dupUrl   = item.url && usedUrls.indexOf(item.url) >= 0;
        var dupTitle = usedTitles.indexOf(item.title) >= 0;
        if (!dupUrl && !dupTitle) {
          merged.regions[rk].push(item);
          if (item.url) usedUrls.push(item.url);
          usedTitles.push(item.title);
        }
      });
    });
    if (newData.editorial && newData.editorial !== existing.editorial) {
      merged.editorial = (existing.editorial ? existing.editorial + '\n\n【补充】' : '') + newData.editorial;
    }
    a[mk][dk] = merged;
  }
  saveArchive(a);
}

function loadBookmarks() { try { return JSON.parse(localStorage.getItem(SK_BM) || '{}'); } catch(e) { return {}; } }
function saveBookmarks(b) { localStorage.setItem(SK_BM, JSON.stringify(b)); }
function bmId(dk, rk, idx) { return dk + '__' + rk + '__' + idx; }
function isBookmarked(dk, rk, idx) {
  // Check by positional key (for current session items)
  var b = loadBookmarks();
  var bid = bmId(dk, rk, idx);
  return Object.values(b).some(function(bm){ return bm.dk === dk && bm.regionKey === rk && (bm.id.startsWith(bid)); });
}
function toggleBookmark(dk, rk, idx, item) {
  var b = loadBookmarks();
  var bid = bmId(dk, rk, idx);
  if (b[bid]) { delete b[bid]; saveBookmarks(b); return false; }
  // Use URL as part of key to prevent overwrite when same position has different article
  var uniqueBid = bid + '__' + Date.now();
  b[uniqueBid] = { id: uniqueBid, dk: dk, mk: dk.slice(0,6), regionKey: rk, category: item.category, title: item.title, summary: item.summary, url: item.url, savedAt: Date.now() };
  saveBookmarks(b);
  return true;
}

function loadSummArchive() { try { return JSON.parse(localStorage.getItem(SK_SUMM) || '{}'); } catch(e) { return {}; } }

async function doTranslate(lang, label) {
  document.getElementById('translateDropdown').classList.remove('open');
  if (lang === currentLang) return;
  currentLang = lang;
  document.getElementById('translateLabel').textContent = label;

  if (currentNewsData && (currentView === 'detail' || currentView === 'search')) {
    showStatus('翻译中...', 'loading');
    var langName = {'zh-CN':'Simplified Chinese', 'en':'English', 'ja':'Japanese'}[lang] || 'Simplified Chinese';
    try {
      // Collect all items with index for reliable JSON-based translation
      var items = [];
      ['eu_us','china','sea','japan'].forEach(function(rk) {
        (currentNewsData.regions[rk] || []).forEach(function(it, idx) {
          items.push({n: items.length + 1, rk: rk, idx: idx, title: it.title, summary: it.summary || ''});
        });
      });

      // Send as JSON array (reliable structure, small payload - titles+summaries only)
      var inputArr = items.map(function(it) {
        return {n: it.n, title: it.title, summary: it.summary || ''};
      });
      // IMPORTANT: wrap in object so Worker extractJSON can find it (Worker only extracts {})
      var sys = 'Translate ALL title and summary fields to ' + langName + '.'
        + ' Every item must appear. Wrap result in object:'
        + ' {"items":[{"n":1,"title":"translated title","summary":"translated summary"},...]}';
      var raw = await callClaude(sys, JSON.stringify({items: inputArr}), null);

      // Parse result safely using safeParseJSON (handles object wrapper)
      var parsed = safeParseJSON(raw);
      var arr = parsed && parsed.items;

      if (arr && arr.length) {
        var translated = JSON.parse(JSON.stringify(currentNewsData));
        arr.forEach(function(row) {
          var orig = items.find(function(it) { return it.n === row.n; });
          if (!orig) return;
          var rk = orig.rk, idx = orig.idx;
          if (translated.regions[rk] && translated.regions[rk][idx]) {
            if (row.title && row.title.trim()) translated.regions[rk][idx].title = row.title.trim();
            if (row.summary && row.summary.trim()) translated.regions[rk][idx].summary = row.summary.trim();
          }
        });
        // Translate page_title only (very short, safe)
        if (currentNewsData.page_title) {
          var ptSys = 'Translate this news title to ' + langName + '. Output only the translated title, nothing else.';
          var ptRaw = await callClaude(ptSys, currentNewsData.page_title, null);
          if (ptRaw && ptRaw.trim()) translated.page_title = ptRaw.trim();
        }
        currentNewsData = translated;
        renderDetail(translated);
      } else {
        // Fallback: just re-render without translation changes
        renderDetail(currentNewsData);
      }
      showStatus('✓ 已翻译为 ' + label, 'ok');
      setTimeout(hideStatus, 1500);
    } catch(e) { showStatus('✕ 翻译失败：' + e.message, 'err'); }
    return;
  }

  if (currentReportData && currentView === 'report') {
    showStatus('翻译报告中...', 'loading');
    var langName2 = {'zh-CN':'Simplified Chinese', 'en':'English', 'ja':'Japanese'}[lang] || 'Simplified Chinese';
    try {
      var translated2 = JSON.parse(JSON.stringify(currentReportData));
      // Translate one section at a time (small payload per request)
      for (var si = 0; si < (translated2.sections||[]).length; si++) {
        var sec = translated2.sections[si];
        var secObj = {
          title: sec.title,
          subsections: (sec.subsections||[]).map(function(sub) {
            return {title: sub.title, paragraphs: sub.paragraphs||[]};
          })
        };
        var secSys = 'Translate all text fields (title, paragraphs) to ' + langName2 + '. Keep JSON structure identical. Output ONLY valid JSON.';
        var secRaw = await callClaude(secSys, JSON.stringify(secObj), null);
        var secS = (secRaw||'').replace(/```json/gi,'').replace(/```/g,'').trim();
        var si1 = secS.indexOf('{'), si2 = secS.lastIndexOf('}');
        if (si1 >= 0 && si2 > si1) {
          try {
            var secParsed = JSON.parse(secS.substring(si1, si2+1));
            if (secParsed.title) sec.title = secParsed.title;
            if (secParsed.subsections) {
              secParsed.subsections.forEach(function(sub, subi) {
                if (sec.subsections[subi]) {
                  if (sub.title) sec.subsections[subi].title = sub.title;
                  if (sub.paragraphs) sec.subsections[subi].paragraphs = sub.paragraphs;
                }
              });
            }
          } catch(e) {}
        }
      }
      translated2._urls = currentReportData._urls;
      translated2._date = currentReportData._date;
      translated2._ts = currentReportData._ts;
      currentReportData = translated2;
      renderReport(translated2);
      showStatus('✓ 已翻译为 ' + label, 'ok');
      setTimeout(hideStatus, 1500);
    } catch(e) { showStatus('✕ 翻译失败：' + e.message, 'err'); }
  }
}

// ── Claude API ──
async function callClaude(system, user, tools, model, maxTok) {
  var key = getApiKey();
  if (!key) { openSettings(); throw new Error('请先在设置中填入 Anthropic API Key'); }
  var useModel = model || 'claude-haiku-4-5-20251001';
  var payload = { apiKey: key, model: useModel, max_tokens: maxTok || 4096, system: system, messages: [{ role: 'user', content: user }] };
  if (tools) payload.tools = tools;
  var res = await fetch(getWorker(), { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  if (!res.ok) { var e = await res.json().catch(function(){return{};}); throw new Error((e.error && e.error.message) || ('Error ' + res.status)); }
  var data = await res.json();
  if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
  var text = '';
  if (data.content) data.content.forEach(function(b){ if (b.type === 'text') text += b.text; });
  return text;
}

function safeParseJSON(raw) {
  if (!raw) return null;
  // Strip markdown fences
  var s = raw.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
  // Try all JSON objects from largest to smallest
  var best = null;
  for (var start = 0; start < s.length; start++) {
    if (s[start] !== '{') continue;
    var depth = 0, inStr = false, escape = false;
    for (var end = start; end < s.length; end++) {
      var ch = s[end];
      if (escape) { escape = false; continue; }
      if (ch === '\\' && inStr) { escape = true; continue; }
      if (ch === '"') { inStr = !inStr; continue; }
      if (inStr) continue;
      if (ch === '{') depth++;
      if (ch === '}') {
        depth--;
        if (depth === 0) {
          var candidate = s.substring(start, end + 1);
          try {
            var parsed = JSON.parse(candidate);
            // Prefer the largest valid object
            if (!best || candidate.length > JSON.stringify(best).length) best = parsed;
          } catch(e) {}
          break;
        }
      }
    }
  }
  if (best) return best;
  // Last resort: find outermost { }
  var i = s.indexOf('{'), j = s.lastIndexOf('}');
  if (i < 0 || j < 0) return null;
  var sub = s.substring(i, j + 1);
  try { return JSON.parse(sub); } catch(e) {}
  try { return JSON.parse(sub.replace(/[\u0000-\u001F\u007F]/g, ' ')); } catch(e) {}
  return null;
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    html += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>';
    html += '</span>';

  html += '<span class="card-icon-btn bookmark-btn' + (bm ? ' active' : '') + '" id="bmbtn-' + dk + '_' + rk + '_' + idx + '" onclick="handleBookmark(\'' + dk + '\',\'' + rk + '\',' + idx + ')" title="收藏">';
  html += '<svg width="14" height="14" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
  html += '</span>';

    html += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

      html += '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
      html += esc(item.url) + '</a>';
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

// ── Batch summarise: translate titles + generate Chinese summaries in one Claude call ──
async function batchSummarise(items) {
  if (!items || !items.length) return [];

  var inputArr = items.map(function(it, i) {
    return {idx: i+1, title: it.title, url: it.url};
  });

  // IMPORTANT: Worker's extractJSON only finds {} objects, NOT [] arrays.
  // So we wrap the result in an object: {"items":[...]}
  var sys = '你是一位专业的中文新闻编辑。'
    + '对于给定的新闻列表，无论原文是英语、日语还是其他语言，请为每条新闻：'
    + '1) 将标题翻译/改写成自然流畅的简体中文（最多25字）'
    + '2) 用简体中文写60-80字的摘要，说明这条新闻发生了什么、有什么意义'
    + '输出格式：必须是一个JSON对象，格式为 {"items":[{"idx":1,"zhTitle":"中文标题","zhSummary":"中文摘要"},...]}'
    + '示例：{"items":[{"idx":1,"zhTitle":"OpenAI申请IPO估值8520亿","zhSummary":"OpenAI正式提交IPO申请文件，目标估值达8520亿美元，计划于2026年秋季上市。此举标志着AI行业最大规模的公开募股即将到来。"}]}'
    + '只输出这个JSON对象，以{开头，以}结尾，不要任何解释或markdown。';

  try {
    var raw = await callClaude(sys, JSON.stringify(inputArr), null);
    var parsed = safeParseJSON(raw);
    var arr = parsed && parsed.items;
    if (!arr || !arr.length) {
      console.warn('[batchSummarise] parse failed, raw:', (raw||'').substring(0,200));
      return items;
    }
    return items.map(function(it, i) {
      var found = arr.find(function(a){ return a.idx === (i+1); });
      return Object.assign({}, it, {
        zhTitle: (found && found.zhTitle) ? found.zhTitle : it.title,
        zhSummary: (found && found.zhSummary) ? found.zhSummary : ''
      });
    });
  } catch(e) {
    console.warn('[batchSummarise] error:', e.message);
    return items;
  }
}

// ── Generate news — Step 1: web_search for URLs only (fast, <30s)
//                   Step 2: Jina fetch + Claude summarise (no web_search, no timeout) ──
async function generateNews() {
  var btn = document.getElementById('btnGen');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 生成中...';

  var archive = loadArchive();
  var dk0 = getTodayStr(), mk0 = getMonthKey();

  // Collect all historical URLs for client-side dedup
  var allUsedUrls = new Set();
  Object.values(archive).forEach(function(month) {
    Object.values(month).forEach(function(day) {
      if (day.regions) {
        ['eu_us','china','sea','japan'].forEach(function(rk) {
          (day.regions[rk] || []).forEach(function(it) { if (it.url) allUsedUrls.add(it.url); });
        });
      }
    });
  });

  try {
    // ── STEP 1: Ask Claude to find URLs only (quick web_search, returns in <20s) ──
    showStatus('第1步：正在搜索最新新闻链接...', 'loading');

    var sysList = 'You are a professional Chinese news editor. Use web_search to find recent news.'
      + ' Today is ' + getToday() + '.'
      + ' Find 1-3 real news articles per region (EU/US, China, Southeast Asia, Japan)'
      + ' on topics: AI, ecommerce, digital marketing. Past 7 days only.'
      + ' For each article, write a Chinese title (max 25 chars) and Chinese summary (60-80 chars).'
      + ' CRITICAL: Output ONLY a single valid JSON object, nothing else.'
      + ' Start with { and end with }. No markdown.'
      + ' Format: {"page_title":"YYYYMMDD-中文标题","editorial":"中文点评100字以内","items":[{"title":"中文标题","summary":"中文摘要60-80字","url":"https://...","category":"ai","region":"eu_us"}]}';

    var tools = [{type:'web_search_20250305', name:'web_search'}];
    var listText = await callClaude(sysList, 'Find news URLs now.', tools);
    if (!listText) throw new Error('未收到有效响应');
    var listData = safeParseJSON(listText);
    if (!listData || !listData.items || !listData.items.length) throw new Error('AI返回格式有误，请重试');

    // Client-side dedup
    var items = listData.items.filter(function(it) {
      return it.url && !allUsedUrls.has(it.url);
    });
    if (!items.length) {
      showStatus('✓ 今日新闻已是最新，无重复内容', 'ok');
      setTimeout(hideStatus, 2500);
      btn.disabled = false;
      btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6"/><path d="M2.5 12A10 10 0 0 1 18.8 4.3"/><path d="M2.5 22v-6h6"/><path d="M21.5 12A10 10 0 0 1 5.2 19.7"/></svg> 生成今日新闻';
      return;
    }

    // Step1 already has Chinese title+summary, use directly
    var regions = {eu_us:[], china:[], sea:[], japan:[]};
    items.forEach(function(item) {
      var rk = item.region || 'eu_us';
      if (!regions[rk]) rk = 'eu_us';
      regions[rk].push({
        category: item.category || 'ai',
        title: item.title || '',
        summary: item.summary || '',
        url: item.url
      });
    });

    // Build final newsData and save
    var newsData = {
      page_title: listData.page_title || (dk0 + ' - 今日新闻'),
      editorial: listData.editorial || '',
      regions: regions,
      _date: dk0, _month: mk0, _ts: Date.now()
    };
    if (newsData.page_title) newsData.page_title = newsData.page_title.replace(/周报/g, '日报');

    // Overwrite today's entry (dedup already done client-side)
    var a = loadArchive();
    if (!a[mk0]) a[mk0] = {};
    a[mk0][dk0] = newsData;
    saveArchive(a);
    currentNewsData = newsData; currentLang = 'zh-CN';
    showDetail(dk0, newsData);
    rebuildSidebar();
    showStatus('✓ 生成完成，共 ' + items.length + ' 条新闻', 'ok');
    setTimeout(hideStatus, 2500);
    document.getElementById('translateWrap').style.display = 'flex';
    document.getElementById('translateLabel').textContent = '翻译';

  } catch(e) { showStatus('✕ 失败：' + e.message, 'err'); }

  btn.disabled = false;
  btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6"/><path d="M2.5 12A10 10 0 0 1 18.8 4.3"/><path d="M2.5 22v-6h6"/><path d="M21.5 12A10 10 0 0 1 5.2 19.7"/></svg> 生成今日新闻';
}

    html += '<span class="card-icon-btn expand-btn" id="ebtn-' + hcid + '" onclick="toggleExpand(\'' + hcid + '\')" title="展开">';
    html += '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

    if (b.url) {
      html += '<a class="card-url" href="' + esc(b.url) + '" target="_blank" rel="noopener">';
      html += '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
      html += esc(b.url) + '</a>';
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

var hlPages = {}; // {mk: currentPage}
var HL_PAGE_SIZE = 10;

function buildHighlightsHTML() {
  var bms   = loadBookmarks();
  var bList = Object.values(bms).sort(function(a,b){ return (b.savedAt||0) - (a.savedAt||0); });
  var html  = '<div class="section-divider"><div class="section-divider-line"></div><div class="section-divider-title">⭐ 重点新闻 HIGHLIGHTS</div><div class="section-divider-line"></div></div>';
  if (!bList.length) {
    html += '<div class="empty" style="padding:40px 20px;"><div class="empty-icon" style="font-size:32px;">⭐</div><div class="empty-text" style="font-size:13px;">还没有收藏的重点新闻</div><div class="empty-sub">点击新闻卡片右上角 ☆ 图标收藏</div></div>';
    return html;
  }
  var currentMk = getMonthKey();
  var byMonth = {};
  bList.forEach(function(b){ if (!byMonth[b.mk]) byMonth[b.mk] = []; byMonth[b.mk].push(b); });
  Object.keys(byMonth).sort(function(a,b){ return b.localeCompare(a); }).forEach(function(mk) {
    var items = byMonth[mk];
    var isCurrentMonth = (mk === currentMk);
    // Default: current month open, others collapsed
    var bodyOpen = isCurrentMonth ? ' open' : '';
    var headerOpen = isCurrentMonth ? ' open' : '';
    // Pagination
    if (!hlPages[mk]) hlPages[mk] = 1;
    var page = hlPages[mk];
    var totalPages = Math.ceil(items.length / HL_PAGE_SIZE);
    var pageItems = items.slice((page-1)*HL_PAGE_SIZE, page*HL_PAGE_SIZE);

    html += '<div class="highlights-month" id="hlm-' + mk + '">';
    html += '<div class="highlights-month-header' + headerOpen + '" onclick="toggleHL(this)"><span class="arr">▶</span>';
    html += '<span class="highlights-month-title">⭐ ' + fmtMonth(mk) + ' 重点新闻</span>';
    html += '<span class="highlights-month-count">' + items.length + ' 条</span></div>';
    html += '<div class="highlights-month-body' + bodyOpen + '">';
    html += '<div class="highlights-month-actions"><button class="btn btn-primary btn-sm" onclick="showSummaryPage(\'' + mk + '\')">📋 生成本月重点新闻总结</button></div>';
    html += '<div class="highlights-grid" id="hlg-' + mk + '">';
    pageItems.forEach(function(b) { html += buildHighlightCard(b); });
    html += '</div>';
    // Pagination controls
    if (totalPages > 1) {
      html += '<div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 0;">';
      html += '<button class="btn btn-sm" style="padding:4px 12px;font-size:12px;" ' + (page<=1?'disabled':'onclick="hlGoPage(\'' + mk + '\',' + (page-1) + ')"') + '>← 上一页</button>';
      html += '<span style="font-size:12px;color:var(--text2);">' + page + ' / ' + totalPages + '</span>';
      html += '<button class="btn btn-sm" style="padding:4px 12px;font-size:12px;" ' + (page>=totalPages?'disabled':'onclick="hlGoPage(\'' + mk + '\',' + (page+1) + ')"') + '>下一页 →</button>';
      html += '</div>';
    }
    html += '</div></div>';
  });
  return html;
}

function hlGoPage(mk, page) {
  hlPages[mk] = page;
  // Re-render only that month's grid
  var bms = loadBookmarks();
  var items = Object.values(bms)
    .filter(function(b){ return b.mk === mk; })
    .sort(function(a,b){ return (b.savedAt||0)-(a.savedAt||0); });
  var totalPages = Math.ceil(items.length / HL_PAGE_SIZE);
  var pageItems = items.slice((page-1)*HL_PAGE_SIZE, page*HL_PAGE_SIZE);
  var grid = document.getElementById('hlg-' + mk);
  if (!grid) return;
  grid.innerHTML = pageItems.map(buildHighlightCard).join('');
  // Update pagination buttons
  var container = grid.nextElementSibling;
  if (container) {
    var btns = container.querySelectorAll('button');
    if (btns[0]) { btns[0].disabled = page <= 1; btns[0].setAttribute('onclick', 'hlGoPage(\'' + mk + '\',' + (page-1) + ')'); }
    if (btns[1]) { btns[1].disabled = page >= totalPages; btns[1].setAttribute('onclick', 'hlGoPage(\'' + mk + '\',' + (page+1) + ')'); }
    var span = container.querySelector('span');
    if (span) span.textContent = page + ' / ' + totalPages;
  }
}

function renderHighlightsSection() {
  if (currentView === 'highlights') {
    document.getElementById('mainContent').innerHTML = buildHighlightsHTML();
    return;
  }
  var el = document.querySelector('.section-divider');
  if (!el) return;
  var toRemove = [];
  while (el) { toRemove.push(el); el = el.nextElementSibling; }
  toRemove.forEach(function(e){ e.remove(); });
  var div = document.createElement('div');
  div.innerHTML = buildHighlightsHTML();
  while (div.firstChild) document.getElementById('mainContent').appendChild(div.firstChild);
}

}

async function generateSummary(mk) {
  var btn = document.getElementById('btnSummary');
  if (!btn) return;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> AI 生成详细总结中...';
  showStatus('正在搜索并深度分析各条新闻，请稍候（约60秒）...', 'loading');
  var bms   = loadBookmarks();
  var items = Object.values(bms).filter(function(b){ return b.mk === mk; }).sort(function(a,b){ return (a.savedAt||0)-(b.savedAt||0); });

  // Process each item individually to get deep analysis
  var successCount = 0;
  for (var i = 0; i < items.length; i++) {
    var b = items[i];
    var el = document.getElementById('spara-' + b.id);
    if (!el) continue;
    el.innerHTML = '<p class="summary-para" style="color:var(--text3);">⏳ 正在分析第 ' + (i+1) + '/' + items.length + ' 条...</p>';

    // Try to fetch article content via Jina first
    var articleContent = '';
    if (b.url) {
      try {
        var jinaRes = await fetch('https://r.jina.ai/' + b.url, { headers: { 'Accept': 'text/plain' } });
        if (jinaRes.ok) {
          articleContent = (await jinaRes.text()).slice(0, 400); // Keep small to avoid Worker payload limit
        }
      } catch(e) {}
    }

    var sys = '你是一位资深数字营销分析师，擅长分析行业新闻并写出深度洞察报告。\n'
      + '基于提供的新闻内容，用简体中文写出深度分析，分3段：\n'
      + '第1段：发生了什么——详细还原事件本身，包含具体数据、人名、公司名\n'
      + '第2段：为什么重要——对行业的深层影响与意义\n'
      + '第3段：行动建议——数字营销从业者可以如何应对或借鉴\n'
      + '每段至少100字，内容丰富具体，避免泛泛而谈。\n'
      + '直接输出三段正文，不需要标题标签，段落之间空行分隔。';

    // Keep payload small for Worker: only title + summary (no raw article content)
    var usr = '请分析以下新闻：\n标题：' + b.title
      + '\nURL：' + (b.url || '（无URL）')
      + (b.summary ? '\n摘要：' + b.summary : '')
      + (articleContent ? '\n原文摘录：' + articleContent.slice(0, 300) : '');

    try {
      var raw = await callClaude(sys, usr, null, 'claude-sonnet-4-5');
      if (raw && raw.trim()) {
        var paras = raw.trim().split(/\n\n+/).filter(function(p){ return p.trim().length > 20; });
        if (paras.length) {
          el.innerHTML = paras.map(function(p){ return '<p class="summary-para">' + esc(p.trim()) + '</p>'; }).join('');
          successCount++;
        }
      }
    } catch(e) {
      el.innerHTML = '<p class="summary-para" style="color:var(--err);">分析失败：' + esc(e.message) + '</p>';
    }
  }

  showStatus('✓ 深度总结完成（' + successCount + '/' + items.length + ' 条）', 'ok');
  setTimeout(hideStatus, 3000);
  btn.disabled = false;
  btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> 重新生成总结';
}

async function fetchArticleContent(url) {
  try {
    var jinaUrl = 'https://r.jina.ai/' + url;
    var res = await fetch(jinaUrl, { headers: { 'Accept': 'text/plain' } });
    if (!res.ok) return '[无法抓取: ' + url + ']';
    var text = await res.text();
    return text.slice(0, 8000);
  } catch(e) {
    return '[抓取失败: ' + url + ']';
  }
}

async function analyzeSummarizer() {
  var urls = getUrls();
  if (!urls.length) { showStatus('请先输入至少一个 URL', 'err'); return; }

  var btn = document.getElementById('btnSummAnalyze');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner spinner-light"></span> 分析中...';

  // Step 1: Fetch all articles via Jina
  showStatus('正在抓取文章内容（第 1/' + urls.length + ' 篇）...', 'loading');
  var articles = [];
  for (var i = 0; i < urls.length; i++) {
    showStatus('正在抓取文章内容（第 ' + (i+1) + '/' + urls.length + ' 篇）...', 'loading');
    var content = await fetchArticleContent(urls[i]);
    articles.push({ url: urls[i], content: content });
  }

  // Step 2: Send all content to Claude for synthesis
  showStatus('文章抓取完成，正在 AI 融合分析...', 'loading');

  var articlesText = articles.map(function(a, i) {
    return '=== 文章' + (i+1) + ' URL: ' + a.url + ' ===\n' + a.content;
  }).join('\n\n');

  var sys = '你是一位资深内容分析师，擅长阅读多篇文章后融合总结，写出结构清晰、内容深度的中文报告。\n\n'
    + '报告格式要求：\n'
    + '- 划分3-6个大的Topic，每个大Topic下设2-4个小Topic\n'
    + '- 相似内容合并写，不同内容分开写，不要每篇文章单独总结\n'
    + '- 每个小Topic的内容需注明来源URL及原文原句\n'
    + '- 内容要具体详实，包含原文的关键数据、人名、公司名\n'
    + '- 全部用简体中文写作\n\n'
    + '输出格式为严格JSON（不得输出其他内容）：\n'
    + '{"report_title":"报告标题","sections":[{"title":"大Topic标题","subsections":[{"title":"小Topic标题","paragraphs":["详细段落内容，至少100字"],"source_urls":["来源url"]}]}]}\n'
    + '从 { 开始，以 } 结束，不加任何markdown或解释。';

  var usr = '以下是从各URL抓取的文章内容，请通读所有内容后，按主题逻辑融合总结为一份深度报告：\n\n'
    + articlesText;

  try {
    var text = await callClaude(sys, usr, null, 'claude-sonnet-4-5', 6000);
    if (!text) throw new Error('未收到有效响应');
    var report = safeParseJSON(text);
    if (!report.sections || !report.sections.length) {
      throw new Error('未能生成有效报告，请检查URL是否可访问，或减少URL数量重试');
    }

    report._urls = urls;
    report._date = getTodayStr();
    report._ts   = Date.now();
    currentReportData = report;
    currentView = 'report';
    renderReport(report);
    setHeaderMode('report');
    showStatus('✓ 分析完成', 'ok');
    setTimeout(hideStatus, 2000);
  } catch(e) { showStatus('✕ 分析失败：' + e.message, 'err'); }

  btn.disabled = false;
  btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> 总结分析';
}

function renderReport(report) {
  var tocHtml = '<div class="url-toc-header"><span>目录</span><span class="toc-toggle-btn" onclick="toggleToc()" title="收起/展开">☰</span></div>';
  tocHtml += '<div class="url-toc-content" id="tocContent">';
  (report.sections || []).forEach(function(sec, si) {
    var sid = 'sec-' + si;
    tocHtml += '<div class="toc-group">';
    tocHtml += '<div class="toc-group-title open" id="toc-g-' + si + '" onclick="toggleTocGroup(this,' + si + ')"><span class="arr">▶</span>' + esc(sec.title) + '</div>';
    tocHtml += '<div class="toc-items open" id="toc-items-' + si + '">';
    (sec.subsections || []).forEach(function(sub, ssi) {
      var subid = 'sub-' + si + '-' + ssi;
      tocHtml += '<div class="toc-item" id="toc-' + subid + '" onclick="scrollToSection(\'' + subid + '\')">' + esc(sub.title) + '</div>';
    });
    tocHtml += '</div></div>';
  });
  tocHtml += '</div>';

  var contentHtml = '';
  contentHtml += '<div class="detail-back" onclick="showSummarizer()">← 重新输入 URL</div>';
  contentHtml += '<div class="detail-title">' + esc(report.report_title || '文章总结') + '</div>';
  contentHtml += '<div class="detail-meta" style="margin-bottom:24px;">基于 ' + (report._urls ? report._urls.length : 0) + ' 篇文章 · ' + getToday() + '</div>';

  (report.sections || []).forEach(function(sec, si) {
    contentHtml += '<div class="summ-section" id="sec-' + si + '">';
    contentHtml += '<div class="summ-section-title">' + esc(sec.title) + '</div>';
    (sec.subsections || []).forEach(function(sub, ssi) {
      var subid = 'sub-' + si + '-' + ssi;
      contentHtml += '<div class="summ-subsection" id="' + subid + '">';
      contentHtml += '<div class="summ-subsection-title">' + esc(sub.title) + '</div>';
      (sub.paragraphs || []).forEach(function(p) {
        contentHtml += '<p class="summ-para">' + esc(p) + '</p>';
      });
      if (sub.source_urls && sub.source_urls.length) {
        contentHtml += '<div class="summ-sources"><div class="summ-source-label">📎 来源</div>';
        sub.source_urls.forEach(function(u) {
          contentHtml += '<a class="summ-source-url" href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(u) + '</a>';
        });
        contentHtml += '</div>';
      }
      contentHtml += '</div>';
    });
    contentHtml += '</div>';
  });

  var wrapper = '<div class="url-summarizer">'
    + '<div class="url-toc" id="urlToc"><div class="toc-expand-btn" onclick="toggleToc()" title="展开目录">☰</div>' + tocHtml + '</div>'
    + '<div class="url-content" id="urlContent">' + contentHtml + '</div>'
    + '</div>';

  document.getElementById('mainContent').innerHTML = wrapper;
}

function toggleToc() {
  var toc = document.getElementById('urlToc');
  if (!toc) return;
  toc.classList.toggle('collapsed');
}

function toggleTocGroup(el, idx) {
  el.classList.toggle('open');
  var items = document.getElementById('toc-items-' + idx);
  if (items) items.classList.toggle('open');
}

function scrollToSection(subid) {
  var el = document.getElementById(subid);
  var content = document.getElementById('urlContent');
  if (el && content) {
    content.scrollTo({ top: el.offsetTop - 20, behavior: 'smooth' });
    document.querySelectorAll('.toc-item').forEach(function(t){ t.classList.remove('active'); });
    var tocItem = document.getElementById('toc-' + subid);
    if (tocItem) tocItem.classList.add('active');
  }
}

// ── Download Word ──
function downloadWord() {
  if (!currentReportData) return;
  var text = currentReportData.report_title + '\n\n';
  text += '生成日期：' + getToday() + '\n';
  text += '来源URL：\n' + (currentReportData._urls || []).join('\n') + '\n\n';
  (currentReportData.sections || []).forEach(function(sec) {
    text += '=== ' + sec.title + ' ===\n\n';
    (sec.subsections || []).forEach(function(sub) {
      text += '【' + sub.title + '】\n';
      (sub.paragraphs || []).forEach(function(p) { text += p + '\n\n'; });
      if (sub.source_urls && sub.source_urls.length) {
        text += '来源：' + sub.source_urls.join('、') + '\n';
      }
      text += '\n';
    });
  });

  // Create downloadable file
  var blob = new Blob(['\ufeff' + text], {type: 'text/plain;charset=utf-8'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href   = url;
  a.download = (currentReportData.report_title || 'report') + '.txt';
  a.click();
  URL.revokeObjectURL(url);
  showStatus('✓ 已下载（.txt 格式，可用 Word 打开）', 'ok');
  setTimeout(hideStatus, 2000);
}

// ── Pending URLs for summarizer ──
var pendingUrls = [];

function addUrlToSummarizer(url) {
  if (!url || pendingUrls.indexOf(url) >= 0) return;
  pendingUrls.push(url);
  // If summarizer page is open, add directly
  var urlInputs = document.getElementById('urlInputs');
  if (urlInputs) {
    var inputs = document.querySelectorAll('.url-field');
    var filled = false;
    for (var j = 0; j < inputs.length; j++) {
      if (!inputs[j].value.trim()) { inputs[j].value = url; filled = true; break; }
    }
    if (!filled) {
      addUrlRow();
      var newInputs = document.querySelectorAll('.url-field');
      newInputs[newInputs.length - 1].value = url;
    }
  }
}

function removeUrlFromSummarizer(url) {
  var idx = pendingUrls.indexOf(url);
  if (idx >= 0) pendingUrls.splice(idx, 1);
  // If summarizer page is open, remove from inputs
  var inputs = document.querySelectorAll('.url-field');
  inputs.forEach(function(inp) {
    if (inp.value.trim() === url) {
      // Remove the whole row if it has a remove button, else clear it
      var row = inp.closest('.url-row');
      var removeBtn = row && row.querySelector('.url-remove-btn');
      if (removeBtn) { row.remove(); }
      else { inp.value = ''; }
    }
  });
}

function toggleAnalyzeUrl(btnEl, url) {
  if (!url) return;
  var isAdded = pendingUrls.indexOf(url) >= 0;
  if (isAdded) {
    // Remove
    removeUrlFromSummarizer(url);
    btnEl.style.color = 'var(--text3)';
    showToast('已取消（剩余 ' + pendingUrls.length + ' 个URL）');
  } else {
    // Add
    addUrlToSummarizer(url);
    btnEl.style.color = 'var(--accent)';
    showToast('✓ 已加入新闻总结（共 ' + pendingUrls.length + ' 个URL）');
  }
}

function showToast(msg) {
  var toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = 'position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--accent);color:var(--accent);padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,0.4);transition:opacity 0.3s;';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(function(){ toast.style.opacity = '0'; }, 2000);
}

// ── Attach analyze button click handlers after render ──
function attachAnalyzeHandlers() {
  // Find all analyze buttons by looking for spans with id starting 'analyze-'
  document.querySelectorAll('[id^="analyze-"]').forEach(function(btn) {
    var cid = btn.id.replace('analyze-', '');
    // Find corresponding URL from the card-url link in same card
    var card = btn.closest('.card');
    if (!card) return;
    var urlLink = card.querySelector('.card-url');
    if (!urlLink) return;
    var url = urlLink.href;
    btn.onclick = function() { addUrlToSummarizer(url); };
    btn.style.cursor = 'pointer';
  });
}

// ── Init ──
function init() {
  rebuildSidebar();
  if (!getApiKey()) {
    setHeaderMode('news');
    document.getElementById('mainContent').innerHTML = '<div class="empty"><div class="empty-icon">⚙️</div><div class="empty-text">请先配置 API Key</div><div class="empty-sub" style="margin-top:14px;"><button class="btn btn-primary btn-sm" onclick="openSettings()">打开设置</button></div></div>';
  } else {
    showArchive();
  }
}
init();
</script>
